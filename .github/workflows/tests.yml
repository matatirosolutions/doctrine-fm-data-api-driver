name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            deps: highest
            symfony: '^7.4'
          - php: '8.3'
            deps: highest
            symfony: '^7.4'
          - php: '8.4'
            deps: highest
            symfony: '^8.0'
          - php: '8.2'
            deps: lowest
            symfony: '^7.4'

    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / ${{ matrix.deps }} deps

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Symfony components
        run: |
          composer require --no-update \
            "symfony/http-client:${{ matrix.symfony }}" \
            "symfony/mime:${{ matrix.symfony }}"
          composer require --dev --no-update \
            "symfony/cache:${{ matrix.symfony }}" \
            "symfony/var-exporter:${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit
